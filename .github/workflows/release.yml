name: Publish versioned HACS release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floorplan-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version and matching commit message
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          with open("custom_components/smartify_floorplan3d/manifest.json", encoding="utf-8") as f:
              version = json.load(f)["version"]
          with open("custom_components/smartify_floorplan3d/const.py", encoding="utf-8") as f:
              python_source = f.read()
          with open("custom_components/smartify_floorplan3d/frontend/smartify-floorplan3d.js", encoding="utf-8") as f:
              js_source = f.read()
          py = re.search(r'(?m)^VERSION = "([^"]+)"', python_source)
          js = re.search(r"(?m)^const VERSION = '([^']+)'", js_source)
          if not re.fullmatch(r"[0-9]+\\.[0-9]+\\.[0-9]+", version):
              raise SystemExit("Invalid manifest version: " + version)
          if not py or not js or version != py.group(1) or version != js.group(1):
              raise SystemExit("Manifest, Python and JavaScript versions differ")
          subject = subprocess.check_output(["git", "log", "-1", "--format=%s"], text=True).strip()
          publish = subject.startswith("v" + version + " – ")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("publish=" + str(publish).lower() + "\\n")
              f.write("tag=v" + version + "\\n")
          print("Version:", version, "release commit:", publish)
          PY
      - name: Check whether release exists
        if: steps.version.outputs.publish == 'true'
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish HACS release
        if: steps.version.outputs.publish == 'true' && steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Smartify Floorplan 3D ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest
